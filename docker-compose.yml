services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: gsh-timescaledb
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: game_monitor
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_monitor"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-migrations:
    image: postgres:15-alpine
    container_name: gsh-db-migrations
    environment:
      DB_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/game_monitor"
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        for f in /migrations/*.sql; do
          echo \"Applying migration $$f\";
          psql \"$$DB_URL\" -f \"$$f\" || exit 1;
        done
        echo \"Migrations applied successfully.\"
      "
    depends_on:
      timescaledb:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: gsh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gateway-api:
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    container_name: gsh-gateway-api
    ports:
      - "8000:8000"
    environment:
      DB_URL: "${DB_URL:?DB_URL is required in .env}"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: gsh-ingestion-service
    ports:
      - "8001:8001"
    environment:
      DB_URL: "${DB_URL:?DB_URL is required in .env}"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  anomaly-detection-ml:
    build: ./anomaly-detection-ml
    container_name: gsh-anomaly-detection-ml
    ports:
      - "8002:8002"
    environment:
      DB_URL: "${DB_URL:?DB_URL is required in .env}"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  root-cause-ml:
    build: ./root-cause-ml
    container_name: gsh-root-cause-ml
    ports:
      - "8003:8003"
    environment:
      DB_URL: "${DB_URL:?DB_URL is required in .env}"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  anomaly-bridge:
    build: ./anomaly-detection-ml
    container_name: gsh-anomaly-bridge
    command: ["python", "-u", "bridge.py"]
    environment:
      DB_URL: "${DB_URL:?DB_URL is required in .env}"
      ANOMALY_API_URL: "http://anomaly-detection-ml:8002/predict/anomaly"
      ROOT_CAUSE_API_URL: "http://root-cause-ml:8003/predict/root-cause"
    depends_on:
      timescaledb:
        condition: service_healthy
      anomaly-detection-ml:
        condition: service_started
      root-cause-ml:
        condition: service_started
    restart: unless-stopped

  alerting-service:
    build:
      context: ./alerting-service
    container_name: gsh-alerting-service
    environment:
      # All values are obtained from the .env file — NO hardcoded values
      DB_URL: "${DB_URL:?DB_URL is required in .env}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required in .env}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required in .env}"
      # Daily mode (production):
      REPORT_HOUR_UTC: "${REPORT_HOUR_UTC:-9}"
      REPORT_MINUTE_UTC: "${REPORT_MINUTE_UTC:-0}"
      LOOKBACK_DAYS: "${LOOKBACK_DAYS:-1}"
      # Send a report immediately on startup:
      SEND_ON_STARTUP: "${SEND_ON_STARTUP:-false}"
    depends_on:
      timescaledb:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  timescale_data:
