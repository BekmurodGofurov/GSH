# Container names are prefixed with the compose project name so that
# production and staging can run side by side on one host. Production
# leaves COMPOSE_PROJECT_NAME unset and keeps the historical gsh-* names;
# staging sets COMPOSE_PROJECT_NAME=gsh-staging in its own .env, which
# also gives it its own network and its own timescale_data volume.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-timescaledb
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: game_monitor
      PGPORT: "${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}"
    ports:
      - "${TIMESCALE_HOST_PORT:-${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:?TIMESCALE_PORT or TIMESCALE_HOST_PORT is required in .env}}}:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_monitor -p ${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-migrations:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-db-migrations
    environment:
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        for f in /migrations/*.sql; do
          echo \"Applying migration $$f\";
          psql \"$$DB_URL\" -f \"$$f\" || exit 1;
        done
        echo \"Migrations applied successfully.\"
      "
    depends_on:
      timescaledb:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-redis
    command: ["redis-server", "--port", "${REDIS_CONTAINER_PORT:-${REDIS_PORT:?REDIS_PORT is required in .env}}"]
    ports:
      - "${REDIS_HOST_PORT:-${REDIS_PORT:?REDIS_PORT is required in .env}}:${REDIS_CONTAINER_PORT:-${REDIS_PORT:?REDIS_PORT is required in .env}}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_CONTAINER_PORT:-${REDIS_PORT:?REDIS_PORT is required in .env}}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gateway-api:
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-gateway-api
    ports:
      - "${GATEWAY_HOST_PORT:-${GATEWAY_PORT:?GATEWAY_PORT is required in .env}}:${GATEWAY_CONTAINER_PORT:-${GATEWAY_PORT:?GATEWAY_PORT is required in .env}}"
    environment:
      PORT: "${GATEWAY_CONTAINER_PORT:-${GATEWAY_PORT:?GATEWAY_PORT is required in .env}}"
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
      REDIS_URL: "${REDIS_URL:-redis://redis:${REDIS_CONTAINER_PORT:-${REDIS_PORT:?REDIS_PORT is required in .env}}}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?ADMIN_USERNAME is required in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required in .env}"
      # Optional second admin auth path (X-API-Key header). Empty disables it.
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://${HOST:-${DOMAIN:-localhost}}:${CLIENT_HOST_PORT:-${CLIENT_PORT:-3000}}}"
      # Required: app/agent/router.py raises at import if this is missing, so
      # without it the container cannot start at all. Marked :? so compose
      # reports it once, up front, instead of leaving gateway-api in a
      # restart loop that also blocks the client (it depends_on gateway-api).
      AGENT_LLM_API_KEY: "${AGENT_LLM_API_KEY:?AGENT_LLM_API_KEY is required in .env - get a key at https://aistudio.google.com/app/apikey}"
      # Optional: override the Gemini model id without a code change, for
      # when Google retires the current one. Empty keeps the default.
      AGENT_LLM_MODEL: "${AGENT_LLM_MODEL:-}"
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      # Which voice worker this stack's rooms ask for by name. It defaults
      # off COMPOSE_PROJECT_NAME so dev and production never dispatch each
      # other's worker; it must match VOICE_AGENT_NAME on voice-agent below.
      VOICE_AGENT_NAME: "${VOICE_AGENT_NAME:-${COMPOSE_PROJECT_NAME:-gsh}-voice}"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-ingestion-service
    ports:
      - "${INGESTION_HOST_PORT:-${INGESTION_PORT:?INGESTION_PORT is required in .env}}:${INGESTION_CONTAINER_PORT:-${INGESTION_PORT:?INGESTION_PORT is required in .env}}"
    environment:
      PORT: "${INGESTION_CONTAINER_PORT:-${INGESTION_PORT:?INGESTION_PORT is required in .env}}"
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
      REDIS_URL: "${REDIS_URL:-redis://redis:${REDIS_CONTAINER_PORT:-${REDIS_PORT:?REDIS_PORT is required in .env}}}"
      FRONTEND_URL: "${FRONTEND_URL:-http://${HOST:-${DOMAIN:-localhost}}:${CLIENT_HOST_PORT:-${CLIENT_PORT:-3000}}}"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  anomaly-detection-ml:
    build: ./anomaly-detection-ml
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-anomaly-detection-ml
    ports:
      - "${ANOMALY_ML_HOST_PORT:-${ANOMALY_ML_PORT:?ANOMALY_ML_PORT is required in .env}}:${ANOMALY_ML_CONTAINER_PORT:-${ANOMALY_ML_PORT:?ANOMALY_ML_PORT is required in .env}}"
    environment:
      PORT: "${ANOMALY_ML_CONTAINER_PORT:-${ANOMALY_ML_PORT:?ANOMALY_ML_PORT is required in .env}}"
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  root-cause-ml:
    build: ./root-cause-ml
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-root-cause-ml
    ports:
      - "${ROOT_CAUSE_ML_HOST_PORT:-${ROOT_CAUSE_ML_PORT:?ROOT_CAUSE_ML_PORT is required in .env}}:${ROOT_CAUSE_ML_CONTAINER_PORT:-${ROOT_CAUSE_ML_PORT:?ROOT_CAUSE_ML_PORT is required in .env}}"
    environment:
      PORT: "${ROOT_CAUSE_ML_CONTAINER_PORT:-${ROOT_CAUSE_ML_PORT:?ROOT_CAUSE_ML_PORT is required in .env}}"
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  anomaly-bridge:
    build: ./anomaly-detection-ml
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-anomaly-bridge
    command: ["python", "-u", "bridge.py"]
    environment:
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
      ANOMALY_API_URL: "${ANOMALY_API_URL:-http://anomaly-detection-ml:${ANOMALY_ML_CONTAINER_PORT:-${ANOMALY_ML_PORT:?ANOMALY_ML_PORT is required in .env}}/predict/anomaly}"
      ROOT_CAUSE_API_URL: "${ROOT_CAUSE_API_URL:-http://root-cause-ml:${ROOT_CAUSE_ML_CONTAINER_PORT:-${ROOT_CAUSE_ML_PORT:?ROOT_CAUSE_ML_PORT is required in .env}}/predict/root-cause}"
      # bridge.py reads this; without it here the .env value was ignored.
      BRIDGE_POLL_INTERVAL: "${BRIDGE_POLL_INTERVAL:-5}"
    depends_on:
      timescaledb:
        condition: service_healthy
      anomaly-detection-ml:
        condition: service_started
      root-cause-ml:
        condition: service_started
    restart: unless-stopped

  alerting-service:
    build:
      context: ./alerting-service
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-alerting-service
    environment:
      # All values are obtained from the .env file — NO hardcoded values
      DB_URL: "${DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:${TIMESCALE_CONTAINER_PORT:-${TIMESCALE_PORT:-5432}}/game_monitor}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required in .env}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required in .env}"
      # Daily mode (production):
      REPORT_HOUR_UTC: "${REPORT_HOUR_UTC:-9}"
      REPORT_MINUTE_UTC: "${REPORT_MINUTE_UTC:-0}"
      LOOKBACK_DAYS: "${LOOKBACK_DAYS:-1}"
      # Send a report immediately on startup:
      SEND_ON_STARTUP: "${SEND_ON_STARTUP:-false}"
    depends_on:
      timescaledb:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-client
    ports:
      - "${CLIENT_HOST_PORT:-${CLIENT_PORT:?CLIENT_PORT is required in .env}}:${CLIENT_CONTAINER_PORT:-${CLIENT_PORT:?CLIENT_PORT is required in .env}}"
    environment:
      CLIENT_PORT: "${CLIENT_CONTAINER_PORT:-${CLIENT_PORT:?CLIENT_PORT is required in .env}}"
      PORT: "${CLIENT_CONTAINER_PORT:-${CLIENT_PORT:?CLIENT_PORT is required in .env}}"
      VITE_API_URL: "${VITE_API_URL:-http://${HOST:-${DOMAIN:-localhost}}:${GATEWAY_HOST_PORT:-${GATEWAY_PORT:-8000}}}"
      VITE_WS_URL: "${VITE_WS_URL:-ws://${HOST:-${DOMAIN:-localhost}}:${GATEWAY_HOST_PORT:-${GATEWAY_PORT:-8000}}/ws/live}"
      VITE_ADMIN_PATH: "${VITE_ADMIN_PATH:-/secret-admin}"
    depends_on:
      gateway-api:
        condition: service_started
    restart: unless-stopped

  voice-agent:
    build:
      context: ./voice-agent
    container_name: ${COMPOSE_PROJECT_NAME:-gsh}-voice-agent
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required in .env}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required in .env}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required in .env}"
      AGENT_LLM_API_KEY: "${AGENT_LLM_API_KEY:?AGENT_LLM_API_KEY is required in .env}"
      # The realtime (speech) model and prebuilt voice. Both are set
      # explicitly so a rebuild cannot change how the assistant sounds --
      # see the comment on VOICE_MODEL in worker.py. The model must
      # support bidiGenerateContent; AGENT_LLM_MODEL (the text model used
      # by gateway-api) is a different setting and does not apply here.
      AGENT_VOICE_MODEL: "${AGENT_VOICE_MODEL:-gemini-3.8-live}"
      AGENT_VOICE: "${AGENT_VOICE:-Puck}"
      # Must match VOICE_AGENT_NAME on gateway-api: the gateway stamps this
      # name into every room token, and only the worker registered under it
      # is dispatched.
      VOICE_AGENT_NAME: "${VOICE_AGENT_NAME:-${COMPOSE_PROJECT_NAME:-gsh}-voice}"
      # The P2 tools (mute, acknowledge, daily report) call gateway
      # endpoints that sit behind X-API-Key. Without these the worker sent
      # the header empty and every confirmed P2 action came back 401.
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      GATEWAY_INTERNAL_URL: "http://gateway-api:${GATEWAY_CONTAINER_PORT:-${GATEWAY_PORT:-8000}}"
      INGESTION_INTERNAL_URL: "http://ingestion-service:${INGESTION_CONTAINER_PORT:-${INGESTION_PORT:-8001}}"
    depends_on:
      gateway-api:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  timescale_data:

