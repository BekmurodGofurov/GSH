name: CI

on:
  push:
    # Only the integration branches. Feature branches are covered by the
    # pull_request trigger below; running on every push as well would double
    # every run for no extra signal.
    branches: [developer, main]
  pull_request:
    branches: [developer, main]

# A new push to a PR cancels the run still in flight for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # python-version mirrors each service's Dockerfile base image, so CI
          # tests the interpreter the service actually ships on.
          - service: shared_schemas
            python-version: '3.11'
          - service: gateway-api
            python-version: '3.11'
          - service: ingestion-service
            python-version: '3.11'
          - service: anomaly-detection-ml
            python-version: '3.11'
          - service: root-cause-ml
            python-version: '3.11'
          - service: alerting-service
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest -v

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        # vite.config.js throws when these are unset, so the build needs them
        # even though nothing here talks to a real gateway.
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: ws://localhost:8000/ws/live
          CLIENT_PORT: '5173'
        run: npm run build

  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [python, client]
    # Runs even when a dependency failed, so the gate reports a real verdict
    # instead of being skipped (a skipped required check never resolves).
    if: always()
    steps:
      - name: Check that every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed."
