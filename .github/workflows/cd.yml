name: CD main

# Runs after CI finishes on main; deploys only if CI is green.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Set deployment status to pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${TARGET_SHA}" \
            -f state="pending" \
            -f context="CD / deploy-production" \
            -f description="Deploying to production server..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: SSH into EC2 and update main
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/GSH

            git fetch origin main
            git reset --hard origin/main
            git checkout -B main origin/main

            docker compose up -d --build
            docker compose stop client

            cd client
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/gsh-frontend/

            docker image prune -f

      - name: Set deployment status result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE="success"
            DESC="Successfully deployed to production server"
          else
            STATE="failure"
            DESC="Deploy to production server failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/${TARGET_SHA}" \
            -f state="${STATE}" \
            -f context="CD / deploy-production" \
            -f description="${DESC}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
