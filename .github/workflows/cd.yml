name: CD

on:
  # Deploy only what CI has already tested. This fires when a CI run
  # finishes; the job below keeps only successful runs triggered by a push
  # to developer (-> staging) or main (-> production). PR runs never deploy.
  #
  # workflow_run always uses the copy of this file on the default branch
  # (developer), so changes here take effect once they land there.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [developer, main]
  # Lets the owner re-run a deploy from the Actions tab without a new commit.
  # It deploys the current tip of the chosen environment's branch.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  resolve:
    name: resolve target
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      branch: ${{ steps.target.outputs.branch }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Map branch to environment
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            env="$INPUT_ENV"
            [ "$env" = "production" ] && branch=main || branch=developer
            # Empty sha = deploy whatever the branch points at right now.
            sha=""
          else
            branch="$RUN_BRANCH"
            sha="$RUN_SHA"
            case "$branch" in
              main)      env=production ;;
              developer) env=staging ;;
              *) echo "No environment for branch '$branch'"; exit 1 ;;
            esac
          fi
          echo "Deploying $branch ${sha:-(tip)} to $env"
          {
            echo "environment=$env"
            echo "branch=$branch"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy (${{ needs.resolve.outputs.environment }})
    needs: resolve
    runs-on: ubuntu-latest
    # Environment-scoped secrets and variables (and, for production, any
    # required reviewers) come from Settings -> Environments.
    environment: ${{ needs.resolve.outputs.environment }}

    # Two deploys to the same environment would otherwise run
    # `docker compose up` in the same directory at the same time. Queue
    # them instead, and never cancel a deploy halfway through. Staging and
    # production have separate groups, so one never waits on the other.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: SSH into EC2 and update app
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
          DEPLOY_BRANCH: ${{ needs.resolve.outputs.branch }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          # Production falls back to the paths it has always used, so it
          # keeps deploying even before its environment variables are set.
          # Staging has no fallback: it must never land in production's
          # directory by accident.
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || (needs.resolve.outputs.environment == 'production' && '/home/ubuntu/GSH' || '') }}
          FRONTEND_DIR: ${{ vars.FRONTEND_DIR || (needs.resolve.outputs.environment == 'production' && '/var/www/gsh-frontend' || '') }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DEPLOY_ENV,DEPLOY_BRANCH,DEPLOY_SHA,DEPLOY_DIR,FRONTEND_DIR
          # Stop at the first failing command so a broken build cannot silently
          # leave the old frontend in place and still report success.
          script_stop: true
          script: |
            set -e
            : "${DEPLOY_DIR:?DEPLOY_DIR is not set for the $DEPLOY_ENV environment}"
            : "${FRONTEND_DIR:?FRONTEND_DIR is not set for the $DEPLOY_ENV environment}"
            cd "$DEPLOY_DIR"

            # Staging shares the box with production. Without its own
            # project name it would try to take over production's gsh-*
            # containers, network and database volume.
            if [ "$DEPLOY_ENV" != "production" ] && \
               ! grep -q '^COMPOSE_PROJECT_NAME=' .env; then
              echo "$DEPLOY_DIR/.env must set COMPOSE_PROJECT_NAME (e.g. gsh-staging)" >&2
              exit 1
            fi

            # reset --hard instead of pull: the box lands exactly on the
            # commit CI tested, even if something was touched on the box.
            # The untracked .env files (secrets, never in git) survive this.
            #
            # checkout -B pins the box to the environment's branch as well.
            # Without it the reset would move whatever branch happens to be
            # checked out (a leftover feature branch, say) onto that commit,
            # and a later `git pull` there would try to merge it back in.
            git fetch origin "$DEPLOY_BRANCH"
            TARGET="${DEPLOY_SHA:-origin/$DEPLOY_BRANCH}"
            git reset --hard "$TARGET"
            git checkout -B "$DEPLOY_BRANCH" "$TARGET"

            # Docker configuration
            # Brings up timescaledb, redis, the Python services and the
            # alerting worker. db-migrations runs and exits on its own here.
            docker compose up -d --build

            # The client container only serves the Vite dev server; behind
            # nginx the static build from $FRONTEND_DIR is served instead,
            # so this one stays down.
            docker compose stop client

            # Dashboard configuration
            # The build reads client/.env in $DEPLOY_DIR (VITE_API_URL,
            # VITE_WS_URL, VITE_ADMIN_PATH, CLIENT_PORT) — vite.config.js
            # loads it from the working directory. That file is gitignored,
            # so the reset above never touches it, and nothing here may
            # export those names: a shell variable would override the file
            # and downgrade the https:// URLs.
            cd client
            npm ci
            npm run build
            sudo mkdir -p "$FRONTEND_DIR"
            sudo cp -r dist/* "$FRONTEND_DIR"/

            # Each `--build` leaves the previous image layers behind; without
            # this the EC2 disk fills up after a few dozen deploys.
            docker image prune -f

            echo "Deployed $(git rev-parse --short HEAD) to $DEPLOY_ENV"
