name: CD developer

# Runs after CI finishes on developer; deploys only if CI is green.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [developer]
  workflow_dispatch:

concurrency:
  group: deploy-developer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: SSH into EC2 and update developer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/projects/gsh-dev

            git fetch origin developer
            git reset --hard origin/developer
            git checkout -B developer origin/developer

            docker compose up -d --build
            docker compose stop client

            cd client
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/gsh-dev-frontend/

            docker image prune -f
